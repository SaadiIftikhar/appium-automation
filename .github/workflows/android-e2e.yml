name: Android E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        options: [full, smoke]
        default: full
  schedule:
    # Nightly, so a new app release is caught even when this repo is quiet.
    - cron: "0 3 * * *"

# Least privilege by default; the Pages job asks for what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 34
  # The emulator renders in software here, several times slower than a desktop.
  TIMEOUT_FACTOR: 3

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  e2e:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      # Whether a report reached the Pages staging step. A run cut short
      # (runner lost, cancelled) never gets there, and has nothing to publish.
      report-staged: ${{ steps.stage-report.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: npm ci

      - name: Download the APK under test
        # The x86_64 build runs natively on the x86_64 emulator, with no ARM
        # translation layer in the way.
        run: npm run app:download
        env:
          CADENCE_ASSET: Cadence-x86_64.apk

      # A booted-and-saved AVD snapshot turns a cold boot of several minutes
      # into a quick restore on every later run.
      - name: Restore AVD snapshot
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-pixel_6-4g-2c

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          ram-size: 4096M
          # Half the runner's 4 vCPUs. Given all four, the emulator starves the
          # runner agent until GitHub loses contact and kills the job.
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot saved."

      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          ram-size: 4096M
          # Half the runner's 4 vCPUs. Given all four, the emulator starves the
          # runner agent until GitHub loses contact and kills the job.
          cores: 2
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci-test.sh ${{ (github.event_name == 'pull_request' || github.event.inputs.suite == 'smoke') && '--mochaOpts.grep @smoke' || '' }}

      - name: Build Allure report
        if: always()
        run: npx allure generate reports/allure-results --clean -o reports/allure-report

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reports
          path: |
            reports/allure-report
            reports/failures
            reports/logs
          retention-days: 14

      - name: Stage the report for GitHub Pages
        id: stage-report
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: reports/allure-report

  # The latest report from main, browsable without downloading anything.
  publish-report:
    needs: e2e
    if: always() && needs.e2e.outputs.report-staged == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
