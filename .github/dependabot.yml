version: 2
updates:
  # Appium, its driver and WebdriverIO move quickly; keep them current in
  # one weekly batch rather than a PR per package.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      test-stack:
        patterns: ["*"]
    ignore:
      # typescript-eslint pins a TypeScript range; a TypeScript major lands
      # before the linter supports it and breaks `npm ci`. Move both together
      # by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
